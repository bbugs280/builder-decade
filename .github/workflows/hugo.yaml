name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://builderdecade.com/"

      # Regression guard: EN/ZH homes must not mix languages. The bug this
      # catches (global `site.RegularPages` leaking ZH posts onto the EN home)
      # only reproduces on the Linux/amd64 runner — not on macOS arm64 — so it
      # MUST run here in CI, not just locally. See tests/test_language_isolation.sh.
      - name: Test language isolation
        run: |
          HUGO_BIN=hugo BASEURL="https://builderdecade.com/" bash tests/test_language_isolation.sh

      # Regression guard: stray `**` must never reach rendered prose. Two
      # verified Goldmark shapes cause it (opener-then-bracket, closer-after-
      # CJK-punctuation) and both are invisible in source review. Runs on the
      # built output, so it catches the defect regardless of which shape.
      - name: Check for stray emphasis markers
        run: python3 tests/check_no_stray_emphasis.py --public ./public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
