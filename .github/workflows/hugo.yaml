name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# ⚠️ MIGRATED 2026-11-27 from GitHub Pages to Cloudflare Pages.
# The GitHub Pages workflow was DELETED in the same commit — leaving both would
# mean a future session sees a green Pages run and concludes it deployed, while
# the site actually served from Cloudflare. One deploy path only.
#
# Why: GitHub Pages has no request logs, no _redirects, no _headers, no
# cache-control. Structural ceiling, not a setting.

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.165.0
  CF_PROJECT: builderdecade
  BUILD_DIR: public

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://builderdecade.com/"

      # Regression guard: EN/ZH homes must not mix languages. The bug this
      # catches (global `site.RegularPages` leaking ZH posts onto the EN home)
      # only reproduces on the Linux/amd64 runner — not on macOS arm64 — so it
      # MUST run here in CI, not just locally. See tests/test_language_isolation.sh.
      - name: Test language isolation
        run: |
          HUGO_BIN=hugo BASEURL="https://builderdecade.com/" bash tests/test_language_isolation.sh

      # Regression guard: stray `**` must never reach rendered prose. Two
      # verified Goldmark shapes cause it (opener-then-bracket, closer-after-
      # CJK-punctuation) and both are invisible in source review. Runs on the
      # built output, so it catches the defect regardless of which shape.
      - name: Check for stray emphasis markers
        run: python3 tests/check_no_stray_emphasis.py --public ./public

      # Regression guard: ZH posts must be Traditional Chinese, never Simplified.
      # ZH is this site's only converting lane; a Simplified body passes every
      # other test but breaks the stated language mandate.
      - name: Check ZH posts are Traditional Chinese
        run: python3 tests/check_zh_traditional.py

      # Regression guard: shortcode i18n values inside a JSON payload must not be
      # double-encoded. `| jsonify` applied to an already-quoted string literal
      # yields text with literal quote marks after JSON.parse, which the JS writes
      # into the DOM — visible to the reader only AFTER interaction, so no static
      # HTML check catches it.
      - name: Check for double-encoded shortcode JSON
        run: python3 tests/check_shortcode_json.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.BUILD_DIR }} --project-name=${{ env.CF_PROJECT }} --branch=main

      # ⛔ Exit 0 from wrangler is not evidence the URL serves the new build.
      # A soft-404 returns 200. Assert the real host and a real title.
      - name: Verify live site actually serves this build
        run: |
          sleep 20
          set -e
          echo "== apex headers =="
          HDRS=$(curl -sSI https://builderdecade.com/ | tr -d '\r')
          echo "$HDRS"
          echo "$HDRS" | grep -qi '^server: cloudflare' || { echo "❌ apex not served by Cloudflare"; exit 1; }
          echo "$HDRS" | grep -qi '^cf-ray:' || { echo "❌ no cf-ray — proxy is off"; exit 1; }
          if echo "$HDRS" | grep -qi '^server: github.com'; then echo "❌ still GitHub Pages"; exit 1; fi

          echo "== EN post =="
          curl -sS https://builderdecade.com/posts/saas-template-worth-paying-for/ \
            | grep -qi '<title>' || { echo "❌ EN post missing title"; exit 1; }

          echo "== ZH twin =="
          curl -sS https://builderdecade.com/zh/posts/saas-template-worth-paying-for/ \
            | grep -qi '<title>' || { echo "❌ ZH post missing title"; exit 1; }

          echo "✅ live, on Cloudflare, both trees serving"

      - name: Notify IndexNow (Bing / Yandex / Seznam / Naver)
        # Crawl hint only — Google does not participate in IndexNow.
        # Non-blocking: a ping failure must not fail the deploy.
        continue-on-error: true
        run: |
          python3 scripts/indexnow_ping.py \
            https://builderdecade.com/ \
            https://builderdecade.com/zh/ \
            https://builderdecade.com/sitemap.xml
