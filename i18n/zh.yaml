- id: solo_calc_note
  translation: 這個計算器完全在你的瀏覽器裡運算——不發任何網路請求、不做儲存、這個區塊也沒有埋任何追蹤。你填的數字不會離開這個頁面。（網站本身在其他地方有標準的流量統計；這個方塊不會碰到它。）
