# --- Terminal action: MCP config audit shortcode ---
- id: mcp_audit_title
  translation: Run the check on your own config
- id: mcp_audit_intro
  translation: Three greps against your MCP config. Copy, run, read the output. Nothing here is sent anywhere — the commands run on your own machine.
- id: mcp_audit_step1
  translation: Hidden characters (invisible instructions)
- id: mcp_audit_step2
  translation: Sensitive paths
- id: mcp_audit_step3
  translation: Exfiltration shapes
- id: mcp_audit_copy
  translation: Copy
- id: mcp_audit_copied
  translation: Copied
- id: mcp_audit_score_title
  translation: Now score what you found
- id: mcp_audit_score_intro
  translation: Tick every statement that is TRUE for your setup. The count is your exposure.
- id: mcp_audit_q1
  translation: I have an agent that can both read files AND make outbound network calls
- id: mcp_audit_q2
  translation: At least one server was added from a blog post, README, or a registry I didn't vet
- id: mcp_audit_q3
  translation: I have never read the tool descriptions of a server I connected
- id: mcp_audit_q4
  translation: A server holds a credential that is broader than the job it does
- id: mcp_audit_q5
  translation: Destructive actions (delete, deploy, transfer) can run without my explicit confirmation
- id: mcp_audit_zero
  translation: Tick any that apply — the count is your exposure.
- id: mcp_audit_v0
  translation: Nothing flagged — clean.
- id: mcp_audit_a0
  translation: Your setup already follows the four rules. Re-run the greps whenever you add a server.
- id: mcp_audit_v1
  translation: 1 flag — contained.
- id: mcp_audit_a1
  translation: Fix the one item. That single change is the highest-value thing on this page.
- id: mcp_audit_v2
  translation: 2-3 flags — meaningful blast radius.
- id: mcp_audit_a2
  translation: Start with rule 1 (one server, one job) and rule 4 (gate destructive actions). Those two shrink the radius most per minute spent.
- id: mcp_audit_v3
  translation: 4-5 flags — your agent is a single point of failure.
- id: mcp_audit_a3
  translation: Assume any server you did not vet is hostile, and work backwards — what could it reach? Revoke the broadest credential first.

- id: agent_reach_title
  translation: Score your own exposure
- id: agent_reach_intro
  translation: Six statements about the setup you actually run. Tick what is true. Nothing here is sent anywhere — this scores in your browser.
- id: agent_reach_q1
  translation: At least one of my agents holds a credential that does not expire — an API key, a PAT, or a long-lived token.
- id: agent_reach_q2
  translation: An agent can reach the open internet without a destination allow-list — it can POST anywhere.
- id: agent_reach_q3
  translation: The same agent that holds a wide credential also has a general-purpose tool — a shell, a browser, or an HTTP fetch.
- id: agent_reach_q4
  translation: I have never listed which destinations are allowed — I would have to read the config to answer that.
- id: agent_reach_q5
  translation: I do not have a way to revoke one agent's access without rotating credentials shared with the others.
- id: agent_reach_q6
  translation: If an agent's output became an input to another tool tomorrow, nothing in my setup would flag it.
- id: agent_reach_score
  translation: Your exposure score
- id: agent_reach_v0
  translation: Nothing ticked yet. Tick every statement that is true of your setup.
- id: agent_reach_v1
  translation: Low. You have scoped credentials and a destination boundary. Keep the short expiry.
- id: agent_reach_v2
  translation: Moderate. One or two gaps — the usual one is expiry. Fix that before the next thing you connect.
- id: agent_reach_v3
  translation: High. A standing credential plus an open egress path is the exact shape of the 2026 breaches — no exploit required.
- id: agent_reach_v4
  translation: Critical. Everything that made those incidents possible is present at once. Break the combination — scope it, expire it, allow-list it.
